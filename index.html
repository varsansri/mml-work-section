<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi Media Labs – work first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#141414; --ground-2:#1d1d1d; --ink:#ffffff; --ink-2:#c8c8c8;
  --accent:#d22ff0; --accent-ink:#141414;
  --gutter:clamp(16px,3vw,40px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink);font-family:Mulish,'Muli',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}

.mml-work{position:relative;min-height:100svh;display:grid;grid-template-columns:5fr 7fr;grid-template-rows:1fr auto;column-gap:var(--gutter);padding:0 var(--gutter);overflow:hidden}

/* left: the claim and the numbers */
.intro{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:center;padding:120px 0 48px}
.intro h1{font-weight:300;font-size:clamp(56px,7.4vw,124px);line-height:.92;letter-spacing:-.04em}
.intro h1 b{font-weight:800}
.intro .lede{margin-top:32px;font-size:clamp(18px,1.35vw,20px);line-height:1.5;max-width:30ch}
.facts{display:flex;gap:clamp(24px,3vw,48px);margin-top:48px}
.facts div{display:flex;flex-direction:column}
.facts dd{font-weight:300;font-size:clamp(40px,4.2vw,68px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.facts dt{order:2;margin-top:8px;font-size:16px;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:24px;margin-top:48px}
.btn{display:inline-block;padding:18px 28px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:transform .2s var(--ease),background-color .2s}
.btn:hover{background:#de5cf4}
.btn:active{transform:scale(.97)}
.link{font-size:16px;font-weight:400;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.link:hover{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* right: the wall of work, three columns drifting */
.wall{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:100svh;min-height:720px;margin-right:calc(var(--gutter) * -1)}
.col{display:flex;flex-direction:column;gap:12px;animation:drift 60s linear infinite}
.col:nth-child(2){animation-direction:reverse;animation-duration:72s}
.col:nth-child(3){animation-duration:66s}
.wall:hover .col{animation-play-state:paused}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.tile{position:relative;aspect-ratio:808/632;overflow:hidden;background:var(--ground-2);transition:opacity .35s var(--ease)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.tile:hover img{transform:scale(1.04)}
.tile figcaption{position:absolute;left:0;bottom:0;padding:10px 14px;background:rgba(20,20,20,.86);font-size:14px;line-height:1.3;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s var(--ease)}
.tile:hover figcaption{opacity:1;transform:none}
.wall[data-filter] .tile{opacity:.12}
.wall[data-filter="branding"] .tile[data-type~="branding"],
.wall[data-filter="logos"] .tile[data-type~="logos"],
.wall[data-filter="websites"] .tile[data-type~="websites"],
.wall[data-filter="packaging"] .tile[data-type~="packaging"],
.wall[data-filter="brochures"] .tile[data-type~="brochures"]{opacity:1}

/* bottom: the counts are the filter */
.counts{grid-column:1;grid-row:2;display:flex;flex-wrap:nowrap;gap:2px;padding:24px 0 40px;margin-left:-12px}
.counts button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:12px;background:transparent;transition:background-color .2s}
.counts button:hover{background:var(--ground-2)}
.counts button[aria-pressed="true"]{background:var(--ground-2)}
.counts button[aria-pressed="true"] .n{color:var(--accent)}
.counts .n{font-weight:300;font-size:clamp(24px,2.1vw,32px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.counts .l{margin-top:6px;font-size:14px;color:var(--ink-2)}
.counts button:focus-visible{outline:3px solid var(--accent)}

/* phone: claim, numbers, two moving rows of work, counts */
@media (max-width:860px){
  .mml-work>*{min-width:0}
  .mml-work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;min-height:0;padding-bottom:32px}
  .intro{padding:96px 0 32px}
  .intro h1{font-size:clamp(56px,15vw,128px)}
  .intro .lede{max-width:none}
  .facts{gap:28px;margin-top:32px}
  .actions{margin-top:32px}
  .wall{grid-column:1;grid-row:2;grid-template-columns:1fr;height:auto;min-height:0;gap:10px;margin:0 calc(var(--gutter) * -1)}
  .col{flex-direction:row;gap:10px;width:max-content;animation-name:slide;animation-duration:50s}
  .col:nth-child(3){display:none}
  .col .tile{width:62vw}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .counts{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(3,1fr);padding:24px 0 0;margin:0 -12px}
  .facts{justify-content:space-between}
  .actions .link{margin-left:auto}
  .tile figcaption{display:none}
}
/* entrance: parts arrive in order, once */
@media (prefers-reduced-motion:no-preference){
  .rise{opacity:0;transform:translateY(24px);animation:rise .8s var(--ease) forwards}
  .rise:nth-child(1){animation-delay:.05s}
  .intro>.rise:nth-child(2){animation-delay:.15s}
  .intro>.rise:nth-child(3){animation-delay:.25s}
  .intro>.rise:nth-child(4){animation-delay:.35s}
  .counts.rise{animation-delay:.45s}
  .counts button{opacity:0;transform:translateY(16px);animation:rise .6s var(--ease) forwards}
  .counts button:nth-child(1){animation-delay:.5s}.counts button:nth-child(2){animation-delay:.57s}.counts button:nth-child(3){animation-delay:.64s}
  .counts button:nth-child(4){animation-delay:.71s}.counts button:nth-child(5){animation-delay:.78s}.counts button:nth-child(6){animation-delay:.85s}
  .wall{animation:wallin 1.2s var(--ease) both}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes wallin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){
  .col{animation:none}
  .tile img,.tile figcaption{transition:none}
  .tile figcaption{opacity:1;transform:none}
}
</style>
</head>
<body>

<section class="mml-work" aria-labelledby="mml-work-title">
  <div class="intro">
    <h1 id="mml-work-title" class="rise">Brands<br><b>that sell.</b></h1>
    <p class="lede rise">Branding, packaging and websites from Coimbatore and Dubai.</p>
    <dl class="facts rise">
      <div><dt>years</dt><dd>14</dd></div>
      <div><dt>brands</dt><dd>180+</dd></div>
      <div><dt>industries</dt><dd>8</dd></div>
    </dl>
    <div class="actions rise">
      <a class="btn" href="https://www.mimedialabs.com/works">See all 329 projects</a>
      <a class="link" href="https://api.whatsapp.com/send?phone=918072373060&amp;text=Hi%2C%20I%20am%20looking%20for%20branding">Get a quote</a>
    </div>
  </div>

  <div class="wall" id="wall" aria-label="Recent work">
    <!-- each column holds its tiles twice so the drift loops without a jump -->
    <div class="col" data-set="a"></div>
    <div class="col" data-set="b"></div>
    <div class="col" data-set="c"></div>
  </div>

  <div class="counts rise" role="group" aria-label="Filter the work">
    <button type="button" data-f="" aria-pressed="true"><span class="n">329</span><span class="l">All work</span></button>
    <button type="button" data-f="branding" aria-pressed="false"><span class="n">90</span><span class="l">Branding</span></button>
    <button type="button" data-f="logos" aria-pressed="false"><span class="n">66</span><span class="l">Logos</span></button>
    <button type="button" data-f="websites" aria-pressed="false"><span class="n">65</span><span class="l">Websites</span></button>
    <button type="button" data-f="packaging" aria-pressed="false"><span class="n">52</span><span class="l">Packaging</span></button>
    <button type="button" data-f="brochures" aria-pressed="false"><span class="n">45</span><span class="l">Brochures</span></button>
  </div>
</section>

<script>
(function(){
  var work = {
    a:[['iyarkai_pouch','IYARKAI · pouch','packaging'],['thokku_web','The Thokku Story · website','websites'],['glamzo','Glamzo · salon branding','branding'],['aihiring','AI Hiring · brochure','brochures'],['iyarkai_logo','IYARKAI · logo','logos branding']],
    b:[['oodu','Oodu Implementers · website','websites'],['iyarkai_soap','IYARKAI · soap box','packaging'],['thokku_social','The Thokku Story · launch','branding'],['pebloo','Pebloo · brochure','brochures'],['tjmhss','TJMHSS school · website','websites']],
    c:[['evolve','Evolve · box','packaging'],['nifa','NIFA Trading · social','branding'],['tamore','TA’more · website','websites'],['iyarkai_natural','IYARKAI · health mix','packaging'],['glamzo','Glamzo · poster','brochures']]
  };
  function tile(w, hidden){
    var f=document.createElement('figure'); f.className='tile'; f.setAttribute('data-type',w[2]);
    if(hidden) f.setAttribute('aria-hidden','true');
    f.innerHTML='<img src="img/'+w[0]+'.jpg" width="808" height="632" alt="'+(hidden?'':w[1])+'" loading="lazy"><figcaption>'+w[1]+'</figcaption>';
    return f;
  }
  document.querySelectorAll('.col').forEach(function(col){
    var list=work[col.dataset.set];
    list.forEach(function(w){col.appendChild(tile(w,false));});
    list.forEach(function(w){col.appendChild(tile(w,true));});
  });
  var wall=document.getElementById('wall');
  document.querySelectorAll('.counts button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.counts button').forEach(function(x){x.setAttribute('aria-pressed', x===b?'true':'false');});
      if(b.dataset.f) wall.setAttribute('data-filter',b.dataset.f); else wall.removeAttribute('data-filter');
    });
  });
  var m=location.hash.match(/f=(\w+)/); if(m){var t=document.querySelector('.counts button[data-f="'+m[1]+'"]'); if(t) t.click();}
})();
</script>
</body>
</html>
